set-option -s copy-command "/usr/bin/pbcopy"
bind-key -T root MouseDrag1Pane copy-mode -M
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/usr/bin/pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/usr/bin/pbcopy"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "/usr/bin/pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "/usr/bin/pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "/usr/bin/pbcopy"
