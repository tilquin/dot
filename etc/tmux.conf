source-file -q ~/.config/dot-local/tmux.before

if-shell "uname | grep -q Darwin" "source-file -q ~/.tmux-macosx.conf" ""

set-option -g default-command "${SHELL} -l"

unbind C-b
set -g prefix C-a

bind-key C-d detach

bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key h select-pane -L

set -g mouse on
set -g history-limit 1000000
set -g default-terminal "xterm-256color"
set -g allow-rename off
set -g set-titles off
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

bind-key m choose-session

bind-key / resize-pane -D 3
bind-key - resize-pane -L 3
bind-key * resize-pane -U 3
bind-key + resize-pane -R 3

# set -sa terminal-overrides "Ms==\\E]52;%p1%s;%p2%s\\007"

set -s set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',*:clipboard'

set -ag terminal-overrides "vte*:XT:Ms=\\E]52;c;%p2%s\\7"
set -ag terminal-overrides "xterm*:XT:Ms=\\E]52;c;%p2%s\\7"



# Copy mode
setw -g mode-keys vi
bind [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
unbind p
bind p paste-buffer

# Copy words through tmux's copy-command (native pbcopy on macOS).
# Let applications that requested mouse events handle their own double-clicks.
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -H; send-keys -X select-word; run-shell -d 0.3; send-keys -X copy-pipe-and-cancel'
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel

# enhance contract of highlighted pane
set -g window-style 'fg=colour242'
set -g window-active-style 'fg=terminal'

# Optional private overrides, kept outside the repository.
source-file -q ~/.config/dot-local/tmux.after
